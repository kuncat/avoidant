[package]
authors = ["Alvin Ali Khaled <aak@kuncat.com>"]
description = "The game logic for Avoidant."
edition = "2024"
license = "MIT OR Apache-2.0"
name = "avoidant"
publish = false
repository = "https://github.com/kuncat/avoidant"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
anyhow = "1.0.104"
bluenoise = "0.2.2"
chull = "0.2.4"
# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
futures-channel = "0.3.34"
futures-util = "0.3.34"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# bluenoise still uses rand 0.9/getrandom 0.3; enable its browser backend too.
getrandom03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.106"
n0-future = "0.3.2"
networking = { workspace = true }
rand = "0.10.3"
rand_xoshiro = "0.8.1"
# BlueNoise requires the rand 0.9 RNG traits; keep its generator compatible.
rand_xoshiro07 = { package = "rand_xoshiro", version = "0.7.0" }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
serde-wasm-bindgen = "0.6.5"
svelte-store = "0.1.3"
tsify = { version = "0.5.8", features = ["js"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-subscriber-wasm = "0.1.0"
voronator = "0.2.1"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
wasm-streams = "0.7.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
