[package]
name = "avoidant-competitive"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.9", default-features = false, features = ["alloc"] }
rand_chacha = "0.9"
wasm-bindgen = "0.2"
